<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFind — design prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/prototype/app.css" />
  </head>
  <body>
    <!-- Prototype controls. Not part of the design - delete with the prototype. -->
    <div class="proto" role="group" aria-label="Prototype controls">
      <strong>prototype</strong>
      <span class="pgroup">cards
        <button data-cards="grid" class="on">grid</button>
        <button data-cards="list">list</button>
      </span>
      <span class="pgroup">photos
        <button data-photos="illustrative" class="on">illustrative food</button>
        <button data-photos="real">real storefront</button>
      </span>
    </div>

    <div id="root"></div>
    <script type="module" src="/prototype/app.js"></script>
  </body>
</html>
